name: Release

# 触发条件：推送 @lh-ui/core@x.y.z 格式的 tag（由 pnpm release:push 完成）。
# 注意：GitHub Actions 的 tag 过滤里 * 不匹配 /，带作用域的 tag 必须用 **。
#
# core 是构建期工具链包（private:true，当前不发布 npm），没有可直接拉取的
# 安装包，故用 git archive 打源码 zip 挂载到发行版。不做 npm pack。
# workflow_dispatch 用于重跑某个已有 tag 的发行版创建（例如上次 Gitee 侧失败）。
on:
  push:
    tags:
      - '@lh-ui/core@**'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重建发行版的已有 tag，如 @lh-ui/core@0.1.0'
        required: true

permissions:
  contents: write # gh release create 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析 tag 并做格式守卫
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^@lh-ui/core@[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag [$TAG] 不是 @lh-ui/core@x.y.z 格式，跳过"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#@lh-ui/core@}" >> "$GITHUB_OUTPUT"

      - name: 生成 release notes
        if: steps.meta.outputs.skip != 'true'
        # 首次发版 CHANGELOG 尚未生成，兜底一段说明不阻断留档
        run: |
          if node scripts/release-notes.mjs "${{ steps.meta.outputs.version }}" > release-notes.md 2>/dev/null; then
            cat release-notes.md
          else
            printf '## %s\n\n首个发行版。详见 CHANGELOG.md 与提交历史。\n' "${{ steps.meta.outputs.version }}" > release-notes.md
          fi

      - name: 打源码 zip
        if: steps.meta.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          git archive --format=zip --output "lh-ui-core-${VERSION}-src.zip" HEAD

      - name: 创建 GitHub Release 并挂载源码 zip
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ZIP="lh-ui-core-${{ steps.meta.outputs.version }}-src.zip"
          # 已存在（重跑场景，例如上次 Gitee 侧失败）只重传资产，不重复创建
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

      # Gitee 的 tag 与发行版由本流程统一接管，本地只推 GitHub，避免双写冲突
      - name: 推送 tag 到 Gitee
        if: steps.meta.outputs.skip != 'true'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          git remote add gitee "https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/lh-ui/core.git" || true
          git push gitee "${TAG}" 2>/dev/null \
            || echo "⚠️ Gitee 上已存在该 tag，跳过推送"

      # Gitee 发行版正文带 GitHub Release 的下载链接（Gitee 附件 API 不稳定，不依赖）
      - name: 创建 Gitee 发行版
        if: steps.meta.outputs.skip != 'true'
        continue-on-error: true # GitHub Release 已成功，Gitee 侧失败不阻塞主流程
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          printf '\n\n> 📦 源码包（.zip）：https://github.com/lhgb-top/lh-ui-core/releases/download/%s/lh-ui-core-%s-src.zip\n' \
            "$TAG" "${{ steps.meta.outputs.version }}" >> release-notes.md
          jq -n --arg token "$GITEE_TOKEN" --arg tag "$TAG" --rawfile notes release-notes.md \
            '{access_token:$token, tag_name:$tag, name:$tag, body:$notes, target_commitish:"master"}' \
            | curl -sS -f -X POST "https://gitee.com/api/v5/repos/lh-ui/core/releases" \
                -H "Content-Type: application/json" -d @-
